name: Build and release

# Tests the app on every push to main, and builds a disk image when the tests pass.
# For a release, the image is attached to it as a download, together with a checksum file.
# A release starts in one of two ways. Pushing a tag that starts with v creates the release, with the
# notes of that version from CHANGELOG.md. Publishing a release by hand in GitHub only gets the files.
# The app is signed ad hoc, so this is a test and personal build, not a notarized release.
on:
  push:
    branches: [main]
    tags: ['v*']
    # A change to text files only cannot change the app. Skipping it saves macOS runner minutes.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Documentation/**'
      - 'LICENSE'
      - 'NOTICE'
  # A release made in GitHub itself, whose tag may already exist.
  release:
    types: [published]
  workflow_dispatch:

# A newer push replaces a run that is still going for the same branch. A release is never cancelled,
# because creating a release by hand can start two runs for the same tag, and each one is safe to repeat.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The project needs a recent Xcode for the icon format and the package manifests.
      - name: Use the newest installed Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Test the release scripts
        run: make test-scripts

      - name: Test the app
        run: make test-ci

      # The result bundle shows which test failed and why.
      - name: Keep the test results of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: |
            build/TestResults.xcresult
            build/test.log
          if-no-files-found: ignore
          retention-days: 7

  dmg:
    needs: test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use the newest installed Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build the disk image
        run: make dmg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: StayLit-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dmg
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: StayLit-dmg
          path: dmg

      # The scripts run here with a different awk than on a Mac, so check them before they write notes.
      - name: Test the release scripts
        run: sh Scripts/test-release-scripts.sh

      # A tag that does not match the app version would publish an image with the wrong version in it.
      - name: Check that the tag matches the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(awk -F' = ' '/^MARKETING_VERSION/ { print $2 }' Configuration.xcconfig)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "The tag $TAG does not match the app version $VERSION in Configuration.xcconfig." >&2
            exit 1
          fi

      # Anyone who downloads the image can check it with this file.
      - name: Write the checksum of the image
        run: |
          cd dmg
          for image in *.dmg; do sha256sum "$image" > "$image.sha256"; done
          ls -l

      # A release that already exists, for example one made by hand, keeps its own notes and only gets
      # the files. Otherwise the release is created with the notes of this version from the changelog.
      - name: Attach the image to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dmg/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            Scripts/release-notes.sh "$TAG" > release-notes.md
            {
              echo
              echo '## Install'
              echo
              echo 'Download the disk image below, open it and drag StayLit to the Applications folder.'
              echo 'The app is signed ad hoc and not notarized, so the first time you open it, right-click the app and choose Open.'
              echo 'The .sha256 file is the checksum of the image.'
            } >> release-notes.md
            gh release create "$TAG" dmg/* --repo "$GITHUB_REPOSITORY" --title "StayLit $TAG" --notes-file release-notes.md
          fi
