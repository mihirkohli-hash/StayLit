name: Build and release

# Tests the app on every push to main, and builds a disk image when the tests pass.
# A version tag that starts with v also publishes the image as a GitHub release, with the notes
# of that version from CHANGELOG.md. The app is signed ad hoc, so this is a test and personal build,
# not a notarized release.
on:
  push:
    branches: [main]
    tags: ['v*']
    # A change to text files only cannot change the app. Skipping it saves macOS runner minutes.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Documentation/**'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:

# A newer push replaces a run that is still going for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The project needs a recent Xcode for the icon format and the package manifests.
      - name: Use the newest installed Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Test the release scripts
        run: make test-scripts

      - name: Test the app
        run: make test-ci

      # The result bundle shows which test failed and why.
      - name: Keep the test results of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: |
            build/TestResults.xcresult
            build/test.log
          if-no-files-found: ignore
          retention-days: 7

  dmg:
    needs: test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use the newest installed Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build the disk image
        run: make dmg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: StayLit-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dmg
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: StayLit-dmg
          path: dmg

      # The scripts run here with a different awk than on a Mac, so check them before they write notes.
      - name: Test the release scripts
        run: sh Scripts/test-release-scripts.sh

      # A tag that does not match the app version would publish an image with the wrong version in it.
      - name: Check that the tag matches the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(awk -F' = ' '/^MARKETING_VERSION/ { print $2 }' Configuration.xcconfig)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "The tag $TAG does not match the app version $VERSION in Configuration.xcconfig." >&2
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          Scripts/release-notes.sh "$TAG" > release-notes.md
          gh release create "$TAG" dmg/*.dmg --repo "$GITHUB_REPOSITORY" --title "StayLit $TAG" --notes-file release-notes.md
